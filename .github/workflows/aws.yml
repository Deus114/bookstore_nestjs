name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/book_store_nestjs:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/book_store_nestjs:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/book_store_nestjs:buildcache,mode=max

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'docker-compose.yml'
          target: '/home/${{ secrets.SSH_USER }}/'

      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Login to Docker Hub
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_PASSWORD }}

            # Create network if not exists
            docker network create app_network || true

            # Ensure database is running first
            cd /home/${{ secrets.SSH_USER }}
            # Create .env file from GitHub Secrets for docker-compose
            echo "DB_NAME=${{ secrets.DB_NAME }}" > .env
            echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
            echo "Created .env file from GitHub Secrets"
            # Check if docker-compose is available, install if needed
            if ! command -v docker-compose &> /dev/null && ! docker compose version &> /dev/null; then
              echo "Installing docker-compose..."
              sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi
            # Check if database container exists
            if docker ps -a --format '{{.Names}}' | grep -q '^postgres_db$'; then
              echo "Database container already exists, starting it..."
              # Container exists, just start it (preserves data)
              docker start postgres_db || echo "Container already running"
            else
              echo "Database container not found, creating new one..."
              # Container doesn't exist, create it (first time only)
              if docker compose version &> /dev/null; then
                docker compose up -d db
              else
                docker-compose up -d db
              fi
            fi

            # Wait for database to be ready
            echo "Waiting for database to be ready..."
            timeout=60
            counter=0
            until docker exec postgres_db pg_isready -U ${{ secrets.DB_USERNAME }} > /dev/null 2>&1 || [ $counter -eq $timeout ]; do
              sleep 2
              counter=$((counter + 2))
              echo "Waiting for database... ($counter/$timeout seconds)"
            done

            if [ $counter -ge $timeout ]; then
              echo "Database failed to start in time"
              echo "Checking database container status..."
              docker ps -a | grep postgres_db || echo "Database container not found"
              exit 1
            fi

            echo "Database is ready!"

            # Stop and remove existing app container
            docker stop book_store_nestjs || true
            docker rm book_store_nestjs || true

            # Pull latest app image
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/book_store_nestjs:latest

            # Start app container
            docker run -d --name book_store_nestjs \
              --restart unless-stopped \
              --network app_network \
              -p 5001:5001 \
              -e NODE_ENV=production \
              -e PORT=${{ secrets.PORT }} \
              -e DB_TYPE=${{ secrets.DB_TYPE }} \
              -e DB_HOST=${{ secrets.DB_HOST }} \
              -e DB_PORT=${{ secrets.DB_PORT }} \
              -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e DB_NAME=${{ secrets.DB_NAME }} \
              -e JWT_ACCESS_TOKEN=${{ secrets.JWT_ACCESS_TOKEN }} \
              -e JWT_REFRESH_TOKEN=${{ secrets.JWT_REFRESH_TOKEN }} \
              -e JWT_ACCESS_EXPIRE=${{ secrets.JWT_ACCESS_EXPIRE }} \
              -e JWT_REFRESH_EXPIRE=${{ secrets.JWT_REFRESH_EXPIRE }} \
              -e STORAGE_BUCKET=${{ secrets.STORAGE_BUCKET }} \
              -e AWS_REGION=${{ secrets.AWS_REGION }} \
              -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
              -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
              -e AWS_S3_ENDPOINT=${{ secrets.AWS_S3_ENDPOINT }} \
              ${{ secrets.DOCKERHUB_USERNAME }}/book_store_nestjs:latest

            echo "Deployment completed successfully!"
