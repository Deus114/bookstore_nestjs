name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/book_store_nestjs:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/book_store_nestjs:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/book_store_nestjs:buildcache,mode=max

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'docker-compose.yml'
          target: '/home/${{ secrets.SSH_USER }}/'

      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Login to Docker Hub
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_PASSWORD }}

            # Create network if not exists
            docker network create app_network || true

            cd /home/${{ secrets.SSH_USER }}

            MISSING_VARS=""
            if [ -z "${{ secrets.DB_NAME }}" ]; then
              MISSING_VARS="${MISSING_VARS} DB_NAME"
            fi
            if [ -z "${{ secrets.DB_USERNAME }}" ]; then
              MISSING_VARS="${MISSING_VARS} DB_USERNAME"
            fi
            if [ -z "${{ secrets.DB_PASSWORD }}" ]; then
              MISSING_VARS="${MISSING_VARS} DB_PASSWORD"
            fi
            if [ -z "${{ secrets.DB_PORT }}" ]; then
              MISSING_VARS="${MISSING_VARS} DB_PORT"
            fi

            if [ -n "$MISSING_VARS" ]; then
              exit 1
            fi

            echo "DB_NAME=${{ secrets.DB_NAME }}" > .env
            echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env

            if [ ! -f .env ] || [ ! -s .env ]; then
              exit 1
            fi
            if ! command -v docker-compose &> /dev/null && ! docker compose version &> /dev/null; then
              sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi

            CONTAINER_NAME=$(docker ps -a --format '{{.Names}}' | grep -E '(^postgres_db$|postgres_db$)' | head -n1)
            if [ -n "$CONTAINER_NAME" ]; then
              CONTAINER_STATUS=$(docker inspect -f '{{.State.Status}}' "$CONTAINER_NAME" 2>/dev/null || echo "not_found")
              CONTAINER_EXIT_CODE=$(docker inspect -f '{{.State.ExitCode}}' "$CONTAINER_NAME" 2>/dev/null || echo "0")
              
              if [ "$CONTAINER_STATUS" = "exited" ] && [ "$CONTAINER_EXIT_CODE" != "0" ]; then
                docker rm -f "$CONTAINER_NAME" || true
                docker volume rm $(docker volume ls -q | grep postgres_data) 2>/dev/null || true
                CONTAINER_NAME=""
              else
                docker start "$CONTAINER_NAME" || true
                export DB_CONTAINER_NAME="$CONTAINER_NAME"
              fi
            fi

            if [ -z "$CONTAINER_NAME" ]; then
              if docker compose version &> /dev/null; then
                docker compose up -d db
              else
                docker-compose up -d db
              fi
              sleep 2
              CONTAINER_NAME=$(docker ps -a --format '{{.Names}}' | grep -E '(postgres_db$|db$)' | head -n1)
              export DB_CONTAINER_NAME="${CONTAINER_NAME:-postgres_db}"
            fi

            DB_CONTAINER_NAME="${DB_CONTAINER_NAME:-postgres_db}"
            timeout=60
            counter=0

            while [ $counter -lt $timeout ]; do
              container_status=$(docker inspect -f '{{.State.Status}}' "$DB_CONTAINER_NAME" 2>/dev/null || echo "not_found")
              if [ "$container_status" = "running" ]; then
                break
              elif [ "$container_status" = "exited" ]; then
                exit 1
              fi
              sleep 2
              counter=$((counter + 2))
            done

            if [ "$container_status" != "running" ]; then
              exit 1
            fi

            counter=0
            until docker exec "$DB_CONTAINER_NAME" pg_isready -U ${{ secrets.DB_USERNAME }} > /dev/null 2>&1 || [ $counter -ge $timeout ]; do
              sleep 2
              counter=$((counter + 2))
            done

            if [ $counter -ge $timeout ]; then
              exit 1
            fi

            APP_MISSING_VARS=""
            if [ -z "${{ secrets.PORT }}" ]; then
              APP_MISSING_VARS="${APP_MISSING_VARS} PORT"
            fi
            if [ -z "${{ secrets.DB_TYPE }}" ]; then
              APP_MISSING_VARS="${APP_MISSING_VARS} DB_TYPE"
            fi
            if [ -z "${{ secrets.DB_HOST }}" ]; then
              APP_MISSING_VARS="${APP_MISSING_VARS} DB_HOST"
            fi
            if [ -z "${{ secrets.JWT_ACCESS_TOKEN }}" ]; then
              APP_MISSING_VARS="${APP_MISSING_VARS} JWT_ACCESS_TOKEN"
            fi
            if [ -z "${{ secrets.JWT_REFRESH_TOKEN }}" ]; then
              APP_MISSING_VARS="${APP_MISSING_VARS} JWT_REFRESH_TOKEN"
            fi
            if [ -z "${{ secrets.STORAGE_BUCKET }}" ]; then
              APP_MISSING_VARS="${APP_MISSING_VARS} STORAGE_BUCKET"
            fi
            if [ -z "${{ secrets.AWS_REGION }}" ]; then
              APP_MISSING_VARS="${APP_MISSING_VARS} AWS_REGION"
            fi
            if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
              APP_MISSING_VARS="${APP_MISSING_VARS} AWS_ACCESS_KEY_ID"
            fi
            if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
              APP_MISSING_VARS="${APP_MISSING_VARS} AWS_SECRET_ACCESS_KEY"
            fi

            if [ -n "$APP_MISSING_VARS" ]; then
              exit 1
            fi

            docker stop book_store_nestjs || true
            docker rm book_store_nestjs || true
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/book_store_nestjs:latest
            DOCKER_CMD="docker run -d --name book_store_nestjs"
            DOCKER_CMD="$DOCKER_CMD --restart unless-stopped"
            DOCKER_CMD="$DOCKER_CMD --network app_network"
            DOCKER_CMD="$DOCKER_CMD -p 5001:5001"
            DOCKER_CMD="$DOCKER_CMD -e NODE_ENV=production"
            DOCKER_CMD="$DOCKER_CMD -e PORT=${{ secrets.PORT }}"
            DOCKER_CMD="$DOCKER_CMD -e DB_TYPE=${{ secrets.DB_TYPE }}"
            DOCKER_CMD="$DOCKER_CMD -e DB_HOST=${{ secrets.DB_HOST }}"
            DOCKER_CMD="$DOCKER_CMD -e DB_PORT=${{ secrets.DB_PORT }}"
            DOCKER_CMD="$DOCKER_CMD -e DB_USERNAME=${{ secrets.DB_USERNAME }}"
            DOCKER_CMD="$DOCKER_CMD -e DB_PASSWORD=${{ secrets.DB_PASSWORD }}"
            DOCKER_CMD="$DOCKER_CMD -e DB_NAME=${{ secrets.DB_NAME }}"
            DOCKER_CMD="$DOCKER_CMD -e JWT_ACCESS_TOKEN=${{ secrets.JWT_ACCESS_TOKEN }}"
            DOCKER_CMD="$DOCKER_CMD -e JWT_REFRESH_TOKEN=${{ secrets.JWT_REFRESH_TOKEN }}"
            DOCKER_CMD="$DOCKER_CMD -e JWT_ACCESS_EXPIRE=${{ secrets.JWT_ACCESS_EXPIRE }}"
            DOCKER_CMD="$DOCKER_CMD -e JWT_REFRESH_EXPIRE=${{ secrets.JWT_REFRESH_EXPIRE }}"
            DOCKER_CMD="$DOCKER_CMD -e STORAGE_BUCKET=${{ secrets.STORAGE_BUCKET }}"
            DOCKER_CMD="$DOCKER_CMD -e AWS_REGION=${{ secrets.AWS_REGION }}"
            DOCKER_CMD="$DOCKER_CMD -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}"
            DOCKER_CMD="$DOCKER_CMD -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}"
            DOCKER_CMD="$DOCKER_CMD -e AWS_S3_ENDPOINT=${{ secrets.AWS_S3_ENDPOINT }}"
            DOCKER_CMD="$DOCKER_CMD ${{ secrets.DOCKERHUB_USERNAME }}/book_store_nestjs:latest"
            eval $DOCKER_CMD

            sleep 3
            APP_CONTAINER_STATUS=$(docker inspect -f '{{.State.Status}}' book_store_nestjs 2>/dev/null || echo "not_found")

            if [ "$APP_CONTAINER_STATUS" != "running" ]; then
              exit 1
            fi

            echo "Deployment completed successfully!"
